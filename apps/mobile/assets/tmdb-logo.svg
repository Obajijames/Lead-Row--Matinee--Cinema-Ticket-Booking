<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tmdbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90CEA1" />
      <stop offset="50%" stop-color="#01B4E4" />
      <stop offset="100%" stop-color="#0D253F" />
    </linearGradient>
  </defs>
  <!-- Background Badge Capsule -->
  <rect x="0" y="2" width="180" height="36" rx="8" fill="#0D253F" />
  
  <!-- TMDB Horizontal Pill Bar -->
  <rect x="12" y="10" width="40" height="20" rx="4" fill="url(#tmdbGradient)" />
  
  <!-- Text Label -->
  <text x="62" y="25" fill="#01B4E4" font-family="Inter, -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5">TMDB</text>
</svg>

